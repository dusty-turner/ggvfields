name: Move File

on:
  push:
    branches:
      - main  # Change to your desired branch
    paths:
      - 'docs/**'  # Only trigger when files in the docs directory change

jobs:
  move-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The token is handed to the checkout action rather than written into a
      # clone URL, so it cannot end up in the logs.
      - name: Checkout the target repository
        uses: actions/checkout@v4
        with:
          repository: dusty-turner/blog-reboot
          token: ${{ secrets.PAT }}
          path: blog-reboot

      - name: Move file to another repository
        run: |
          # Synchronize the files to the target repository, replacing existing contents
          rsync -av --delete docs/ blog-reboot/public/ggvfields/

          # Commit and push the changes
          cd blog-reboot
          git config user.email "dusty.s.turner@gmail.com"
          git config user.name "dusty-turner"
          git add .
          git diff --cached --quiet || git commit -m "Move docs from ggvfields"
          git push
